<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Museum-v2</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>

  <!-- =====================================
       TICKET MENU
  ====================================== -->

  <div id="ticket-menu">
    <div class="ticket-window">

      <button
        id="ticket-menu-close"
        type="button"
        aria-label="Close ticket menu"
      >
        ×
      </button>

      <div class="ticket-label">
        MUSEUM ADMISSION
      </div>

      <h2>
        Ticket to the Exhibition
      </h2>

      <p class="ticket-description">
        Admission grants access to all current
        exhibitions and gallery spaces.
      </p>

      <div class="ticket-information">
        <div>
          <span>TYPE</span>
          <strong>GENERAL ADMISSION</strong>
        </div>

        <div>
          <span>ACCESS</span>
          <strong>ALL EXHIBITIONS</strong>
        </div>

        <div>
          <span>PRICE</span>
          <strong>FREE</strong>
        </div>
      </div>

      <button
        id="ticket-menu-button"
        type="button"
      >
        GET TICKET
      </button>

    </div>
  </div>

  <!-- =====================================
       CINEMA FULLSCREEN VIEWER
  ====================================== -->

  <div id="cinema-viewer">

    <div class="cinema-viewer-screen">

      <button
        id="cinema-viewer-close"
        type="button"
        aria-label="Close cinema screen"
      >
        ×
      </button>

      <div class="cinema-placeholder">

        <span class="cinema-placeholder-label">
          CINEMA
        </span>

        <span class="cinema-placeholder-title">
          FILM SCREEN
        </span>

        <span class="cinema-placeholder-note">
          Video will be added here
        </span>

      </div>

    </div>

  </div>

  <script
    type="module"
    src="./main.js"
  ></script>

</body>
</html>
